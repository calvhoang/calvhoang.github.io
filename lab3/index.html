<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title> Sign Up Page </title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="bg-light">
    <main class="row justify-content-center fw-semibold my-5">
        <div class="bg-light border rounded-4 p-4 shadow-sm col-12 col-md-4">
            <h1> Sign Up Form</h1>
            <form id="signupForm" action="welcome.html">
                <label> First Name:
                    <input type="text" id="fName" class="form-control" name="fName">
                </label>

                <label>Last Name:
                    <input type="text" id="lName" class="form-control" name="lName">
                </label><br>

                Gender:
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="male" value="male">
                    <label class="form-check-label" for="male">Male</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                    <label class="form-check-label" for="female">Female</label>
                </div><br>

                <label>Zip Code:
                    <input type="number" id="zip" class="form-control" name="zip">
                </label><br>

                City: <span id="city"></span><br>
                Latitude: <span id="latitude"></span><br>
                Longitude: <span id="longitude"></span><br>

                <label>State:
                    <select id="state" class="form-select" name="state">
                        <option value="">Loading states...</option>
                    </select>
                </label>

                <label>Select a County:
                    <select id="county" class="form-select" name="county">
                        <option value="">Loading counties...</option>
                    </select>
                </label><br>

                <label>Desired Username:
                    <input type="text" id="username" class="form-control" name="username">
                </label>
                <span id="usernameError"></span><br>

                <label>Password:
                    <input type="password" id="password" class="form-control" name="password">
                </label>
                <span id="passwordSuggest"></span><br>

                <label>Type Password Again:
                    <input type="password" id="passwordAgain" class="form-control" name="passwordAgain"><br>
                </label><br>
                <span id="passwordError"></span><br>

                <button class="btn btn-primary shadow-sm">Sign up!</button>
            </form>
        </div>
    </main>
    <footer class="text-center bg-dark text-light">
        <p>&copy; 2026 Calvin Hoang. All rights reserved.</p>
        <p>This site is for academic purposes only.</p>
        <p>CST 336 Internet Programming.</p>
        <img src="img/CSUMB_Logo.png" alt="Cal State Monterey Bay Logo" class="csumb-logo">
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
