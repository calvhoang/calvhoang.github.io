<!DOCTYPE html>
<html>

<head>
    <title> Guess a Number</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>Guess the Number!</h1>
        <h2>Guess a number between 1 and 99 in seven attempts!</h2>
    </header>
    <br>
    <main>
        <div id="game">
            <span>Enter a guess:</span>
            <input type="text" id="playerGuess" size="5">
            <button id="guessBtn"> Guess </button> <br>
            <button id="resetBtn"> Reset </button>
            <p id="feedback"></p>
        </div>
        <div id="stats">
            Previous Guesses:
            <span id="guesses"></span>
            <br>
            Attempts Left:
            <span id="attempts"></span>
            <br>
            Wins:
            <span id="wins">0</span>
            <br>
            Losses:
            <span id="losses">0</span>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Calvin Hoang. All rights reserved.</p>
        <p>This site is for academic purposes only.</p>
        <p>CST 336 Internet Programming.</p>
        <img src="img/CSUMB_Logo.png" alt="Cal State Monterey Bay Logo" class="csumb-logo">
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
