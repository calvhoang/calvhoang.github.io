<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Search Form</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">
    <main class="flex-fill container my-4">
        <div id="formCard" class="card shadow-sm m-4 p-4 mx-auto">
            <h3 class="fw-semibold">Meal Search</h3>
            <form id="mealSearchForm">
                <div class="mb-3">
                    <label for="searchByLabel">Search by:</label>
                    <div class="form-check">
                        <input type="radio" id="name" class="form-check-input" name="searchType" value="name">
                        <label class="form-check-label" for="name">Name</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="category" class="form-check-input" name="searchType" value="category">
                        <label class="form-check-label" for="category">Category</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="mainIngredient" class="form-check-input" name="searchType"
                            value="mainIngredient">
                        <label class="form-check-label" for="mainIngredient">Main Ingredient</label>
                    </div>
                    <div id="selectAlert" class="alert alert-danger py-2" role="alert" hidden>
                        Select one!
                    </div>
                </div>
                <div id="searchContainer" class="mb-3" hidden>
                    <label for="searchByLabel">Search</label>
                    <input type="text" class="form-control" id="searchInput">
                </div>
                <div id="categoryContainer" class="mb-3" hidden>
                    <label for="categoryLabel">Categories</label>
                    <select class="form-select" id="categorySelect">
                        <option value=""></option>
                    </select>
                </div>
                <div id="inputAlert" class="alert alert-danger py-2" role="alert" hidden>
                </div>
                <button class="btn btn-primary shadow-sm">Search</button>
            </form>
        </div>

        <div id="resultsCard" class="card shadow-sm m-4 p-4 mx-auto" hidden>
        </div>
    </main>

    <footer class="text-center bg-dark text-light mt-auto">
        <p>&copy; 2026 Calvin Hoang. All rights reserved.</p>
        <p>This site is for academic purposes only.</p>
        <p>CST 336 Internet Programming.</p>
        <p>API used: <a href="https://www.themealdb.com/docs_api_guide.php" target="_blank" class="link-info">TheMealDB
                Docs</a></p>
        <img src="img/CSUMB_Logo.png" alt="Cal State Monterey Bay Logo" class="csumb-logo">
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
